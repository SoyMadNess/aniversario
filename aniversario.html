<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felices 6 meses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#07021a; --plum:#2a0b4a; --pink:#ff4fa3; --rose:#ffe3f4; --violet:#b36bff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 115%,#4a1272 0%,var(--plum) 38%,var(--night) 80%);
  color:var(--rose);
  font-family:'Quicksand',system-ui,sans-serif;
  overflow:hidden;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
main{
  position:relative;z-index:1;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2rem;padding:1.5rem;text-align:center;pointer-events:none;
}
h1{
  margin:0;font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700;
  font-size:clamp(2.6rem,11vw,5.6rem);line-height:1.1;min-height:2.3em;
  color:var(--rose);
  text-shadow:0 0 12px rgba(255,79,163,.9),0 0 34px rgba(179,107,255,.8),0 0 70px rgba(255,79,163,.5);
}
.caret{
  display:inline-block;width:3px;height:.85em;margin-left:4px;vertical-align:-.05em;
  background:var(--pink);box-shadow:0 0 10px var(--pink);animation:blink .8s steps(2) infinite;
}
.done .caret{opacity:0;animation:none;transition:opacity 1s}
@keyframes blink{50%{opacity:0}}
.since{
  margin:0;opacity:0;transition:opacity 1.6s ease;
  font-size:clamp(1rem,3.6vw,1.2rem);letter-spacing:.04em;color:#e9c9ff;
}
.counter{
  display:flex;gap:.7rem;opacity:0;transform:translateY(14px);
  transition:opacity 1.6s ease .5s,transform 1.6s ease .5s;
}
.done .since,.done .counter{opacity:1;transform:none}
.unit{
  min-width:4.3rem;padding:.8rem .5rem;border-radius:16px;
  border:1px solid rgba(255,150,220,.4);background:rgba(70,20,110,.4);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 0 24px rgba(179,107,255,.25);
}
.unit b{display:block;font-size:clamp(1.7rem,7vw,2.7rem);font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.unit span{font-size:.8rem;color:#e9c9ff}
.hint{
  position:fixed;left:0;right:0;bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));
  z-index:1;text-align:center;font-size:.85rem;color:#cfa8f0;opacity:.8;pointer-events:none;
  transition:opacity 1s;
}
.hint.off{opacity:0}
.open,.paper button{
  font-family:'Quicksand',system-ui,sans-serif;font-size:1rem;font-weight:700;color:var(--rose);
  padding:.7rem 1.5rem;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,150,220,.6);background:rgba(120,30,150,.45);
  box-shadow:0 0 22px rgba(255,79,163,.35);
}
.open{opacity:0;pointer-events:none;transition:opacity 1.6s ease 1.2s}
.done .open{opacity:1;pointer-events:auto}
.veil{
  position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:1.2rem;
  background:rgba(7,2,26,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;
}
.veil.show{opacity:1;visibility:visible}
.paper{
  width:100%;max-width:30rem;max-height:85%;overflow:auto;padding:1.6rem 1.4rem;border-radius:18px;
  border:1px solid rgba(255,150,220,.45);
  background:linear-gradient(160deg,rgba(80,22,120,.9),rgba(40,10,70,.95));
  box-shadow:0 0 40px rgba(255,79,163,.3);text-align:center;
}
.paper p{
  margin:0 0 1.3rem;min-height:12rem;text-align:left;white-space:pre-wrap;
  font-family:'Dancing Script','Brush Script MT',cursive;font-weight:700;
  font-size:clamp(1.35rem,5vw,1.75rem);line-height:1.45;color:var(--rose);
}
.paper p{text-shadow:0 0 8px rgba(255,79,163,.35)}
.g{animation:glow 2s ease-out both}
.g.s{animation:none}
@keyframes glow{
  0%{color:#fff;text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 26px var(--violet),0 0 44px var(--pink)}
  100%{color:var(--rose);text-shadow:0 0 8px rgba(255,79,163,.35)}
}
.doom{
  padding:.9rem 1.2rem 1rem;border-radius:12px;
  border:1px solid rgba(255,79,163,.55);background:rgba(10,2,28,.65);
  box-shadow:0 0 28px rgba(255,79,163,.25),inset 0 0 24px rgba(179,107,255,.15);
  opacity:0;transform:translateY(14px);transition:opacity 1.6s ease 1s,transform 1.6s ease 1s;
}
.done .doom{opacity:1;transform:none}
.doom p{margin:0 0 .6rem;font-size:.95rem;color:#e9c9ff}
.digits{
  display:flex;justify-content:center;align-items:flex-start;gap:.12em;
  font-family:'Share Tech Mono',ui-monospace,monospace;font-size:clamp(2rem,10vw,3.2rem);line-height:1;
  color:#ff7cc4;text-shadow:0 0 10px var(--pink),0 0 26px var(--pink);font-variant-numeric:tabular-nums;
}
.digits .g{display:flex;flex-direction:column;align-items:center}
.digits small{
  margin-top:.45rem;font-family:'Quicksand',system-ui,sans-serif;font-size:.7rem;color:#e9c9ff;text-shadow:none;
}
.digits i{font-style:normal;opacity:.85;animation:blink 1s steps(2) infinite}
.snd{
  position:fixed;z-index:3;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);
  width:44px;height:44px;border-radius:50%;font-size:1.2rem;line-height:1;cursor:pointer;
  border:1px solid rgba(255,150,220,.5);background:rgba(70,20,110,.5);color:var(--rose);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.moon{
  position:fixed;z-index:0;top:calc(env(safe-area-inset-top,0px) + 6%);right:9%;
  width:clamp(90px,24vw,180px);aspect-ratio:1;border-radius:50%;pointer-events:none;

<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var W,H,stars=[],rockets=[],sparks=[];
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    stars=[];var n=Math.floor(W*H/5500);
    for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.9,r:Math.random()*1.4+.3,p:Math.random()*6.28,s:Math.random()*1.5+.5});
  }
  window.addEventListener('resize',resize);resize();

  function rnd(a,b){return a+Math.random()*(b-a)}
  // Rosa (320-345) y morado (265-290)
  function pickHues(){
    var combos=[[330,280],[340,270],[320,290],[335,335],[275,275]];
    return combos[Math.floor(Math.random()*combos.length)];
  }

  function launch(tx,ty){
    var x0=tx===undefined?rnd(W*.12,W*.88):Math.max(0,Math.min(W,tx+rnd(-W*.2,W*.2)));
    if(tx===undefined){tx=x0;}
    var targetY=ty===undefined?rnd(H*.12,H*.5):ty;
    var vy=-rnd(8,10.5),frames=(H-targetY)/-vy;
    rockets.push({x:x0,y:H,vx:(tx-x0)/frames,vy:vy,ty:targetY,tx:tx,hues:pickHues()});
  }

  function explode(x,y,hues){
    var heart=Math.random()<.3,n=heart?90:rnd(80,130)|0,power=rnd(3.2,5.2);
    for(var i=0;i<n;i++){
      var vx,vy;
      if(heart){
        var t=i/n*6.283;
        vx=16*Math.pow(Math.sin(t),3)*.2;
        vy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*.2;
      }else{
        var a=Math.random()*6.283,sp=power*Math.sqrt(Math.random())+.6;
        vx=Math.cos(a)*sp;vy=Math.sin(a)*sp;
      }
      sparks.push({x:x,y:y,px:x,py:y,vx:vx,vy:vy,life:1,decay:rnd(.008,.017),
        hue:hues[Math.random()<.5?0:1]+rnd(-8,8),l:rnd(60,82)});
    }
    // destello central
    sparks.push({x:x,y:y,px:x,py:y,vx:0,vy:0,life:1,decay:.06,hue:hues[0],l:95,flash:1});
  }

  window.addEventListener('pointerdown',function(e){
    launch(e.clientX,e.clientY);
    var h=document.getElementById('hint');if(h)h.classList.add('off');
  });

  // Lluvia de pétalos
  var petals=[];
  function newPetal(anywhere){
    return {x:rnd(0,W),y:anywhere?rnd(-20,H):-20,s:rnd(6,12),vy:rnd(.6,1.4),sw:rnd(.6,1.6),ph:rnd(0,6.28),
      rot:rnd(0,6.28),vr:rnd(-.03,.03),hue:Math.random()<.6?rnd(325,345):rnd(280,300),l:rnd(68,82)};
  }
  for(var q=0;q<Math.max(18,Math.min(40,Math.floor(W/26)));q++)petals.push(newPetal(true));

  var next=0,t0=performance.now();
  function frame(now){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
    var tt=(now-t0)/1000;
    for(var i=0;i<stars.length;i++){
      var s=stars[i],a=.35+.65*(.5+.5*Math.sin(tt*s.s+s.p));
      ctx.fillStyle='rgba(255,235,250,'+a.toFixed(2)+')';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();
    }
    for(var pi=0;pi<petals.length;pi++){
      var pt=petals[pi];
      pt.y+=pt.vy;pt.x+=Math.sin(tt*pt.sw+pt.ph)*.8;pt.rot+=pt.vr;
      if(pt.y>H+20){petals[pi]=newPetal(false);continue;}
      ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(pt.rot);
      ctx.fillStyle='hsla('+pt.hue+',85%,'+pt.l+'%,.8)';
      ctx.beginPath();ctx.ellipse(0,0,pt.s*.55,pt.s,0,0,6.283);ctx.fill();
      ctx.restore();
    }
    ctx.globalCompositeOperation='lighter';
    if(now>next){launch();next=now+rnd(900,1800);}
    for(var r=rockets.length-1;r>=0;r--){
      var k=rockets[r];k.x+=k.vx;k.y+=k.vy;
      ctx.strokeStyle='hsla('+k.hues[0]+',100%,80%,.9)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(k.x-k.vx*4,k.y-k.vy*4);ctx.lineTo(k.x,k.y);ctx.stroke();
      if(k.y<=k.ty){explode(k.x,k.y,k.hues);rockets.splice(r,1);}
    }
    for(var j=sparks.length-1;j>=0;j--){
      var p=sparks[j];
      p.px=p.x;p.py=p.y;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy=p.vy*.985+.04;p.life-=p.decay;
      if(p.life<=0){sparks.splice(j,1);continue;}
      ctx.strokeStyle='hsla('+p.hue+',100%,'+p.l+'%,'+p.life.toFixed(2)+')';
      ctx.lineWidth=p.flash?10*p.life:2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Mensaje con efecto de escritura
  var text='Felices 6 meses mi amor',typed=document.getElementById('typed'),i=0;
  function finish(){document.body.classList.add('done');}
  function type(){
    typed.textContent=text.slice(0,++i);
    if(i<text.length){setTimeout(type,reduce?0:95);}else{setTimeout(finish,500);}
  }
  setTimeout(type,900);

  // Carta (cambia este texto por el tuyo)
  var letterText='Mi reina,\n\nHoy cumplimos 6 meses y no dejo de pensar en lo mucho que me hace feliz tenerte a mi lado.\n\nGracias por tu paciencia, por tus risas y por hacer mis días más bonitos.\n\nTe amo porque contigo soy quien soy siempre, me das la libertad de expresarme y de no cambiar la persona que soy.\n\nAunque ha habido dificultades y momentos difíciles, tú me has acompañado, y hemos podido comunicarnos y solucionarlo.\n\nSé que habrá más dificultades en el futuro, y no sé qué sea de mí o de ambos, pero quiero que seas quien me acompañe en el camino que hemos tomado.\n\nToma mi mano y tomaré la tuya, vayamos paso a paso pero que sea juntos.\n\nY si me caigo, ayúdame a levantarme, yo haré lo mismo por ti.\n\nPermíteme seguir sumando más tiempo a tu lado.\n\nTe amo muchísimo.';
  var veil=document.getElementById('veil'),letterEl=document.getElementById('letter'),li=0,timer=null;
  function stopTyping(){if(timer){clearInterval(timer);timer=null;}}
  function openLetter(){
    stopTyping();li=0;letterEl.textContent='';veil.classList.add('show');
    var paperEl=document.getElementById('paper');
    timer=setInterval(function(){
      var ch=letterText.charAt(li++);
      if(ch==='\n'){letterEl.appendChild(document.createTextNode('\n'));}
      else{var sp=document.createElement('span');sp.className='g';sp.textContent=ch;letterEl.appendChild(sp);}
      paperEl.scrollTop=paperEl.scrollHeight;
      if(li>=letterText.length)stopTyping();
    },reduce?0:24);
  }
  function closeLetter(){stopTyping();veil.classList.remove('show');}
  ['open','veil','snd'].forEach(function(id){
    document.getElementById(id).addEventListener('pointerdown',function(e){e.stopPropagation();});
  });
  document.getElementById('open').addEventListener('click',openLetter);
  document.getElementById('close').addEventListener('click',closeLetter);
  letterEl.addEventListener('click',function(){stopTyping();letterEl.textContent=letterText;});

  // Contador desde el 17 de mayo
  var start=new Date(2026,4,17,0,0,0);
  function pad(n){return n<10?'0'+n:''+n}
  // Sonido tic-tac (se activa con el primer toque, como exigen los navegadores)
  var actx=null,soundOn=false,tock=false,sndBtn=document.getElementById('snd');
  var busNode=null;
  function getBus(){
    if(busNode)return busNode;
    var inp=actx.createGain(),out=actx.createGain();out.gain.value=.9;
    inp.connect(out);
    // eco con repeticiones que se van apagando
    var dl=actx.createDelay(1),fb=actx.createGain(),lp=actx.createBiquadFilter(),dg=actx.createGain();
    dl.delayTime.value=.28;fb.gain.value=.45;lp.type='lowpass';lp.frequency.value=2500;dg.gain.value=.55;
    inp.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(dg);dg.connect(out);
    // reverberación de sala grande
    var rl=Math.floor(actx.sampleRate*1.8),ir=actx.createBuffer(2,rl,actx.sampleRate);
    for(var c=0;c<2;c++){var d=ir.getChannelData(c);for(var i=0;i<rl;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rl,3);}
    var conv=actx.createConvolver();conv.buffer=ir;var rg=actx.createGain();rg.gain.value=.5;
    inp.connect(conv);conv.connect(rg);rg.connect(out);
    out.connect(actx.destination);
    busNode=inp;return busNode;
  }
  function ensureAudio(){
    if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}
    if(actx&&actx.state==='suspended')actx.resume();
  }
  function setLabel(){sndBtn.textContent=(actx&&soundOn)?'🔊':'🔇';}
  function tickSound(){
    if(!actx||!soundOn||actx.state!=='running')return;
    var t=actx.currentTime,k=tock?.85:1,bus=getBus();
    // golpe grave del mecanismo
    var th=actx.createOscillator(),tg=actx.createGain();
    th.type='sine';th.frequency.setValueAtTime(110*k,t);th.frequency.exponentialRampToValueAtTime(45,t+.12);
    tg.gain.setValueAtTime(.0001,t);tg.gain.exponentialRampToValueAtTime(.7,t+.003);tg.gain.exponentialRampToValueAtTime(.0001,t+.16);
    th.connect(tg);tg.connect(bus);th.start(t);th.stop(t+.18);
    // clic seco
    var len=Math.floor(actx.sampleRate*.02),buf=actx.createBuffer(1,len,actx.sampleRate),dt=buf.getChannelData(0);
    for(var i=0;i<len;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/len,5);
    var src=actx.createBufferSource();src.buffer=buf;
    var hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1800*k;
    var ng=actx.createGain();ng.gain.value=.9;
    src.connect(hp);hp.connect(ng);ng.connect(bus);src.start(t);
    // eco metálico breve
    var mo=actx.createOscillator(),mg=actx.createGain();
    mo.type='triangle';mo.frequency.value=1650*k;
    mg.gain.setValueAtTime(.0001,t);mg.gain.exponentialRampToValueAtTime(.06,t+.002);mg.gain.exponentialRampToValueAtTime(.0001,t+.12);
    mo.connect(mg);mg.connect(bus);mo.start(t);mo.stop(t+.13);
    tock=!tock;
  }
  function tickSoundOld(){
    if(!actx||!soundOn||actx.state!=='running')return;
    var t=actx.currentTime;
    // chasquido seco, como el escape de un reloj mecánico
    var len=Math.floor(actx.sampleRate*.035),buf=actx.createBuffer(1,len,actx.sampleRate),dt=buf.getChannelData(0);
    for(var i=0;i<len;i++)dt[i]=(Math.random()*2-1)*Math.pow(1-i/len,6);
    var src=actx.createBufferSource();src.buffer=buf;
    var bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=tock?2100:2700;bp.Q.value=1.3;
    var ng=actx.createGain();ng.gain.value=1.6;
    src.connect(bp);bp.connect(ng);ng.connect(actx.destination);src.start(t);
    // resonancia breve de madera/metal (el "tic" es más agudo que el "tac")
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(tock?400:540,t);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.28,t+.002);
    g.gain.exponentialRampToValueAtTime(.0001,t+.1);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.11);
    tock=!tock;
  }
  window.addEventListener('pointerdown',function(e){
    if(e.target===sndBtn)return;
    if(!actx){ensureAudio();soundOn=true;}else if(actx.state==='suspended'){actx.resume();}
    setLabel();
  },true);
  sndBtn.addEventListener('click',function(){
    if(!actx){ensureAudio();soundOn=true;}else{soundOn=!soundOn;}
    setLabel();
  });

  function tick(){
    tickSound();
    var d=Math.max(0,Date.now()-start.getTime()),s=Math.floor(d/1000);
    document.getElementById('d').textContent=Math.floor(s/86400);
    document.getElementById('h').textContent=pad(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=pad(Math.floor(s%3600/60));
    document.getElementById('s').textContent=pad(s%60);
    var rem=Math.max(0,Math.floor((new Date(2026,11,17,0,0,0).getTime()-Date.now())/1000));
    document.getElementById('dd').textContent=pad(Math.floor(rem/86400));
    document.getElementById('dh').textContent=pad(Math.floor(rem%86400/3600));
    document.getElementById('dm').textContent=pad(Math.floor(rem%3600/60));
    document.getElementById('ds').textContent=pad(rem%60);
  }
  tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
